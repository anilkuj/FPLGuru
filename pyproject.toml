[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["packages", "services"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "fplguru_core", "fplguru_fpl_client", "fplguru_ingest",
    "fplguru_ml", "fplguru_api", "fplguru_worker", "fplguru_live", "fplguru_alerts",
    "fplguru_push", "fplguru_tools", "fplguru_llm", "fplguru_captain",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E402", "E501", "I001", "UP035", "UP007"]
