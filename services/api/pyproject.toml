[project]
name = "fplguru-api"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.111,<1", "uvicorn[standard]>=0.30", "fplguru-core", "fplguru-entrysync"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fplguru_api"]
