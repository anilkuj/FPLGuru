[project]
name = "fplguru-worker"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4",
    "fplguru-core",
    "fplguru-fpl-client",
    "fplguru-ingest",
    "fplguru-ml",
    "fplguru-entrysync",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fplguru_worker"]
