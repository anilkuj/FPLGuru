[project]
name = "fplguru-pitch"
version = "0.0.0"
description = "Async PitchAPI (xG/xA) REST client."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "tenacity>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fplguru_pitch"]
