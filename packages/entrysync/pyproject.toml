[project]
name = "fplguru-entrysync"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["fplguru-core", "fplguru-fpl-client", "fplguru-ingest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fplguru_entrysync"]
