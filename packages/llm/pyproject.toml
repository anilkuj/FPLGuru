[project]
name = "fplguru-llm"
version = "0.0.0"
description = "Async Gemini REST client + cost estimation."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "tenacity>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fplguru_llm"]
