name: fplguru

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fplguru
      POSTGRES_PASSWORD: fplguru
      POSTGRES_DB: fplguru
    ports: ["5432:5432"]
    volumes: ["fplguru_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fplguru -d fplguru"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  fplguru_pg:
